<svg xmlns="http://www.w3.org/2000/svg" width="980" height="820" viewBox="0 0 980 820" role="img" aria-label="ThoughtKeep architecture: the request path from person through token verification, per-entry policy, Model Armor screening, Gemini, and back, with Firestore storage and an owner dashboard that has no path to user content.">
  <rect width="980" height="820" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Helvetica,Arial,sans-serif;fill:#0f172a}
    .lbl{font-size:14px;font-weight:600}
    .sub{font-size:11.5px;fill:#475569;font-weight:400}
    .hd{font-size:11px;font-weight:700;letter-spacing:.9px;fill:#64748b}
    .ttl{font-size:19px;font-weight:700}
    .cap{font-size:12px;fill:#475569}
    .ln{stroke:#334155;stroke-width:1.8;fill:none}
    .ldeny{stroke:#b91c1c;stroke-width:1.8;fill:none}
    .lno{stroke:#94a3b8;stroke-width:1.8;fill:none;stroke-dasharray:7 5}
    .bx{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:8}
    .gate{fill:#eef2ff;stroke:#6366f1;stroke-width:2;rx:8}
    .deny{fill:#fef2f2;stroke:#dc2626;stroke-width:1.8;rx:8}
    .store{fill:#f0fdf4;stroke:#16a34a;stroke-width:1.8;rx:8}
    .watch{fill:#fffbeb;stroke:#d97706;stroke-width:1.8;rx:8}
  </style>

  <text class="t ttl" x="34" y="40">ThoughtKeep — request path</text>
  <text class="t cap" x="34" y="62">Nothing reaches the model, and nothing returns, without passing both gates.</text>

  <!-- centre column -->
  <rect class="bx" x="330" y="92" width="300" height="46"/>
  <text class="t lbl" x="480" y="112" text-anchor="middle">Person writing or speaking</text>
  <text class="t sub" x="480" y="129" text-anchor="middle">browser · sends a Firebase ID token</text>

  <line class="ln" x1="480" y1="138" x2="480" y2="172" marker-end="url(#a)"/>

  <rect class="bx" x="330" y="172" width="300" height="46"/>
  <text class="t lbl" x="480" y="192" text-anchor="middle">Cloud Run · Express</text>
  <text class="t sub" x="480" y="209" text-anchor="middle">asia-southeast1 · bounded autoscaling</text>

  <line class="ln" x1="480" y1="218" x2="480" y2="252" marker-end="url(#a)"/>

  <rect class="bx" x="330" y="252" width="300" height="52"/>
  <text class="t lbl" x="480" y="272" text-anchor="middle">Verify token · Firebase Admin SDK</text>
  <text class="t sub" x="480" y="290" text-anchor="middle">signature, claims, email_verified, Google-only</text>

  <line class="ln" x1="480" y1="304" x2="480" y2="338" marker-end="url(#a)"/>

  <rect class="bx" x="330" y="338" width="300" height="52"/>
  <text class="t lbl" x="480" y="358" text-anchor="middle">Per-entry policy check</text>
  <text class="t sub" x="480" y="376" text-anchor="middle">may the AI read this entry?</text>

  <line class="ln" x1="480" y1="390" x2="480" y2="424" marker-end="url(#a)"/>

  <rect class="gate" x="330" y="424" width="300" height="56"/>
  <text class="t hd" x="480" y="444" text-anchor="middle">THE GATE · INBOUND</text>
  <text class="t lbl" x="480" y="463" text-anchor="middle">Model Armor · us-central1</text>
  <text class="t sub" x="480" y="477" text-anchor="middle">injection · harmful · secrets · malicious links</text>

  <line class="ln" x1="480" y1="480" x2="480" y2="514" marker-end="url(#a)"/>

  <rect class="bx" x="330" y="514" width="300" height="46"/>
  <text class="t lbl" x="480" y="534" text-anchor="middle">Gemini</text>
  <text class="t sub" x="480" y="551" text-anchor="middle">reply buffered in full before anything is emitted</text>

  <line class="ln" x1="480" y1="560" x2="480" y2="594" marker-end="url(#a)"/>

  <rect class="gate" x="330" y="594" width="300" height="56"/>
  <text class="t hd" x="480" y="614" text-anchor="middle">THE GATE · OUTBOUND</text>
  <text class="t lbl" x="480" y="633" text-anchor="middle">screened before a single byte is sent</text>
  <text class="t sub" x="480" y="647" text-anchor="middle">the reply is judged before the reader sees it</text>

  <line class="ln" x1="480" y1="650" x2="480" y2="684" marker-end="url(#a)"/>

  <rect class="bx" x="330" y="684" width="300" height="42"/>
  <text class="t lbl" x="480" y="710" text-anchor="middle">Reply streamed to the person</text>

  <!-- deny path -->
  <rect class="deny" x="682" y="424" width="266" height="88"/>
  <text class="t hd" x="815" y="446" text-anchor="middle" fill="#b91c1c">BLOCKED</text>
  <text class="t lbl" x="815" y="466" text-anchor="middle" fill="#7f1d1d">not sent · not stored</text>
  <text class="t sub" x="815" y="484" text-anchor="middle" fill="#7f1d1d">a flagged match blocks — and so does</text>
  <text class="t sub" x="815" y="499" text-anchor="middle" fill="#7f1d1d">a gate that cannot answer. Fails closed.</text>

  <path class="ldeny" d="M630 452 L682 452" marker-end="url(#ar)"/>
  <path class="ldeny" d="M630 622 C 660 622, 660 512, 682 500" marker-end="url(#ar)"/>

  <rect class="deny" x="682" y="252" width="266" height="52"/>
  <text class="t lbl" x="815" y="274" text-anchor="middle" fill="#7f1d1d">401 — nothing proceeds</text>
  <text class="t sub" x="815" y="291" text-anchor="middle" fill="#7f1d1d">no route establishes identity any other way</text>
  <path class="ldeny" d="M630 278 L682 278" marker-end="url(#ar)"/>

  <rect class="deny" x="682" y="338" width="266" height="52"/>
  <text class="t lbl" x="815" y="360" text-anchor="middle" fill="#7f1d1d">excluded from all context</text>
  <text class="t sub" x="815" y="377" text-anchor="middle" fill="#7f1d1d">"never send to AI" · including summaries</text>
  <path class="ldeny" d="M630 364 L682 364" marker-end="url(#ar)"/>

  <!-- left: secret + storage -->
  <rect class="bx" x="34" y="172" width="258" height="52"/>
  <text class="t lbl" x="163" y="192" text-anchor="middle">Secret Manager</text>
  <text class="t sub" x="163" y="210" text-anchor="middle">gemini-api-key via secretKeyRef</text>
  <path class="ln" d="M292 198 L330 198" marker-end="url(#a)"/>

  <rect class="store" x="34" y="514" width="258" height="56"/>
  <text class="t hd" x="163" y="534" text-anchor="middle" fill="#15803d">THE KEEP</text>
  <text class="t lbl" x="163" y="552" text-anchor="middle">users/{uid}/entries</text>
  <text class="t sub" x="163" y="566" text-anchor="middle">owner-bound rules · default deny</text>
  <path class="ln" d="M330 537 L292 537" marker-end="url(#a)"/>

  <rect class="store" x="34" y="596" width="258" height="56"/>
  <text class="t hd" x="163" y="616" text-anchor="middle" fill="#15803d">THE LEDGER</text>
  <text class="t lbl" x="163" y="634" text-anchor="middle">users/{uid}/securityEvents</text>
  <text class="t sub" x="163" y="648" text-anchor="middle">server writes · the user only reads</text>
  <path class="ln" d="M330 622 L292 622" marker-end="url(#a)"/>

  <!-- watchtower -->
  <rect class="watch" x="34" y="694" width="258" height="66"/>
  <text class="t hd" x="163" y="714" text-anchor="middle" fill="#b45309">THE WATCHTOWER</text>
  <text class="t lbl" x="163" y="732" text-anchor="middle">owner only · aggregates</text>
  <text class="t sub" x="163" y="748" text-anchor="middle">reads admin/metrics and nothing else</text>

  <path class="lno" d="M163 694 L163 652"/>
  <circle cx="163" cy="673" r="11" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <line x1="156" y1="666" x2="170" y2="680" stroke="#b91c1c" stroke-width="2.2"/>
  <line x1="170" y1="666" x2="156" y2="680" stroke="#b91c1c" stroke-width="2.2"/>

  <rect x="682" y="596" width="266" height="130" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" rx="8"/>
  <text class="t hd" x="700" y="620" fill="#b45309">WHY THE CROSS</text>
  <text class="t sub" x="700" y="642">No code path exists from the</text>
  <text class="t sub" x="700" y="658">Watchtower to any user's entries.</text>
  <text class="t sub" x="700" y="678">A test reads that file's own source</text>
  <text class="t sub" x="700" y="694">and fails if such a query is ever</text>
  <text class="t sub" x="700" y="710">added — the guarantee is the</text>
  <text class="t sub" x="700" y="726">absence of the code, not a promise.</text>

  <text class="t cap" x="34" y="796">Firebase Authentication · Cloud Firestore · Cloud Run · Gemini · Model Armor · Secret Manager · Cloud Text-to-Speech</text>
</svg>
